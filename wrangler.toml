name = "pixel-syntax-delivery-software"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "pixel-syntax-delivery-demo-documents"
preview_bucket_name = "pixel-syntax-delivery-demo-documents-preview"
